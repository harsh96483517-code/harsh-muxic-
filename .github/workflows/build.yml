name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q harsh-muxic.zip
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Build APK
        working-directory: harsh-muxic
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew assembleProdDebug
      - uses: actions/upload-artifact@v4
        with:
          name: harsh-muxic-apk
          path: harsh-muxic/app/build/outputs/apk/prod/debug/*.apk
